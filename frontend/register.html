<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>UrbanRisk — Register</title>

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="brand">

                <div class="brand-icon">
                    U
                </div>

                <div>

                    <h1>
                        UrbanRisk
                    </h1>

                    <p>
                        Urban Intelligence Platform
                    </p>

                </div>

            </div>


            <div class="auth-header">

                <h2>
                    Create your account
                </h2>

                <p>
                    Start monitoring urban risks in your city.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div
                    id="registerError"
                    class="auth-error"
                ></div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign in
                </a>

            </div>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
