<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UrbanRisk — Login</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="brand">
                <div class="brand-icon">U</div>

                <div>
                    <h1>UrbanRisk</h1>
                    <p>Urban Intelligence Platform</p>
                </div>
            </div>


            <div class="auth-header">

                <h2>Welcome back</h2>

                <p>
                    Sign in to access your city risk dashboard.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div
                    id="loginError"
                    class="auth-error"
                ></div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Sign In
                </button>

            </form>


            <div class="auth-footer">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create account
                </a>

            </div>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
